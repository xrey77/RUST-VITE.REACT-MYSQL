[package]
name = "rust_mysql8"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio-native-tls", "rust_decimal", "macros", "chrono", "uuid"] }
tokio = { version = "1", features = ["full"] } # For async runtime
axum = { version = "0.7", features = ["macros", "multipart"] }
dotenv = "0.15" # To load database URL from a .env file
rust_decimal = { version = "1.33", features = ["serde", "macros"] }
reqwest = "0.12.24"
argon2 = "0.5.3"
rand_core = "0.9.3"
askama = "0.14.0"
bcrypt = "0.17.1"
anyhow = "1.0.100"
sqlx-core = "0.8.6"
jsonwebtoken = { version = "10.2.0", features = ["aws_lc_rs"] }
chrono = "0.4.42"
rand = "0.9.2"
totp-rs = { version = "^5.7.0", features = ["gen_secret", "otpauth", "qr"] }
base32 = "0.5.1"
base64 = "0.22.1"
multer = "3.1.0"
tower-http = { version = "0.6.7", features = ["cors", "limit", "fs"] } # For setting body limits
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
http = "1.4.0"
data-encoding = "2.9.0"
